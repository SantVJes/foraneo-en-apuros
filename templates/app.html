{% load static %}<!doctype html>
<html lang="es-MX">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Foráneo en apuros</title>

      </a>
      <nav class="tabs" aria-label="Secciones">
        <a href="#menu" data-tab="menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h10"/></svg><span>Mi semana</span></a>
        <a href="#alacena" data-tab="alacena"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v4H7zM6 7h12v14H6zM9 12h6"/></svg><span>Alacena</span></a>

    </div>
  </header>

  <main id="contenido" class="contenido" tabindex="-1">
    <div id="vista"></div>
  </main>

  <div class="aviso" id="aviso" role="status" aria-live="polite" hidden></div>
  <dialog class="hoja" id="hoja"><div id="hoja-contenido"></div></dialog>

  <script>window.FA_CONFIG = {googleClientId: "{{ google_client_id|escapejs }}"};</script>
  <script src="{% static 'app/app.js' %}"></script>

</html>
